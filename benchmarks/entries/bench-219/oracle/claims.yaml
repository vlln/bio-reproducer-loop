claims:
- id: C1
  metric: AD 相关 SNV 位于内含子/基因间（distal-RE）区域的比例
  paper_value: 91.1
  unit: '%'
  tolerance:
    type: relative
    value: 0.05
  source: paper Results 'Deep learning profiles...' (91.1% of adSNVs in intronic or
    intergenic regions)
  author_match: unknown
  author_repr: null
  notes: 共收集 18,826 个 adSNVs（来自 3 项 GWAS）；摘要称 ~90% 非编码
  target_id: ad-snvs-distal-re-911
- id: C2
  metric: DLPFC 中识别的推定性 silencer adSNV 数量
  paper_value: 1457
  unit: 'silencer adSNVs (enhancer: 3084)'
  tolerance:
    type: relative
    value: 0.05
  source: paper Abstract; Results (1457 putative silencer and 3084 putative enhancer
    adSNVs; 合计 radSNVs)
  author_match: unknown
  author_repr: null
  notes: radSNV 平均重叠 1.5 个 TF ChIP-seq 峰（3 倍富集）；3.1% 位于 100 脊椎动物保守区
  target_id: silencer-ad-snvs-1457
- id: C3
  metric: DLPFC TREDNet 模型增强子预测 auROC
  paper_value: 0.985
  unit: auROC
  tolerance:
    type: relative
    value: 0.05
  source: paper Results (auROC 0.985 for enhancers and 0.899 for silencers; auPRC
    0.885/0.637)
  author_match: unknown
  author_repr: null
  notes: 正负样本比 1:9 交叉验证；silencer auROC 0.899
  target_id: trednet-enhancer-auroc-0985
- id: C4
  metric: rs636317 保护等位基因 C 在 CTCF ChIP-seq reads 中的占比
  paper_value: 90
  unit: '%'
  tolerance:
    type: relative
    value: 0.05
  source: paper Results 'Δactivity identifies rs636317...' (90% of reads carrying
    C versus 67% allele frequency in brain samples, P=2x10^-78)
  author_match: unknown
  author_repr: null
  notes: rs636317 为 MS4A 位点推定性因果 silencer 变异；邻近中性变异 rs636341 距其 11 bp，Δactivity 可忽略
  target_id: rs636317-ctcf-allele-90
- id: C5
  metric: dMPRA SNV 中 Δactivity 与 dMPRA 方向一致率（DCR）
  paper_value: 63.4
  unit: '%'
  tolerance:
    type: relative
    value: 0.05
  source: paper Results 'Accurate prediction...' (63.4% of dMPRA SNVs show directional
    concordance)
  author_match: unknown
  author_repr: null
  notes: 10 个 CRISPR 验证 radSNV 中 DCR 达 90%；|Δactivity| 与 |dMPRA| 均居前 5% 时 ≥82.6%；摘要概括为
    ~70% 方向一致性
  target_id: dmpra-directional-concordance-634
- id: C6
  metric: SL 位点 radSNV eQTL 中微胶质细胞特异的比例
  paper_value: 70
  unit: '%'
  tolerance:
    type: relative
    value: 0.05
  source: paper Results 'SL-locus radSNVs...microglia' (70% of SL-locus radSNV eQTLs
    are microglia specific, P=0.001 vs 39% of all eQTLs)
  author_match: unknown
  author_repr: null
  notes: SL 位点微胶质 DEG 100% 在 AD 中上调（vs 59% 全基因组均值）；90.4% SL 位点微胶质 eQTL 效应为正（vs 45.7%）
  target_id: sl-locus-microglia-eqtl-70
