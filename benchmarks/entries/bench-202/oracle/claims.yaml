- id: C1
  metric: Cohort size (>=3 brain MRIs, ADNI+AIBL+OASIS3 combined)
  paper_value: 1243
  unit: participants
  tolerance:
    type: relative
    value: 0.05
  source: paper Abstract + Results 'Summary of combined study cohort' / Table 1
  author_match: unknown
  author_repr: null
  notes: 49% female, mean age 71.7 y (SD 7.6). 3589 had >=1 FLAIR MRI; 1243 had >=3
    MRIs and were analyzed.
  target_id: wmh-cohort-n-1243
- id: C2
  metric: Cross-sectional association of WMH volume with baseline beta-amyloid burden
  paper_value: 0.27
  unit: standardized beta coefficient (per SD centiloid, log-WMH)
  tolerance:
    type: relative
    value: 0.05
  source: paper Table 2 (primary LME model); Abstract
  author_match: unknown
  author_repr: null
  notes: Estimate 0.27, 95% CI 0.20-0.35, p<0.001, adjusting for age, sex, APOE4,
    FSRP.
  target_id: wmh-amyloid-cross-sectional-beta
- id: C3
  metric: WMH growth rate increase per SD increase in baseline beta-amyloid (centiloid)
  paper_value: 0.021
  unit: log-WMH growth slope change per SD centiloid
  tolerance:
    type: relative
    value: 0.05
  source: paper Table 2 (longitudinal slope); Abstract
  author_match: unknown
  author_repr: null
  notes: Estimate 0.021, 95% CI 0.012-0.03, t=4.74, p<0.001. Results text misprints
    0.027; Table 2 value 0.021 used.
  target_id: wmh-growth-amyloid-slope
- id: C4
  metric: Cross-sectional association of WMH volume with baseline FSRP (vascular risk)
  paper_value: 0.25
  unit: standardized beta coefficient (per SD FSRP, log-WMH)
  tolerance:
    type: relative
    value: 0.05
  source: paper Table 2
  author_match: unknown
  author_repr: null
  notes: Estimate 0.25, 95% CI 0.14-0.35, p<0.001. Results text gives beta=0.26 (0.15-0.36)
    for same association; Table 2 value used.
  target_id: wmh-fsrp-cross-sectional-beta
- id: C5
  metric: FSRP association with WMH growth rate over time
  paper_value: -0.028
  unit: log-WMH growth slope change per SD FSRP
  tolerance:
    type: relative
    value: 0.05
  source: paper Table 2 (longitudinal slope)
  author_match: unknown
  author_repr: null
  notes: Estimate -0.028, 95% CI -0.04 to -0.02, t=-4.7, p<0.001; higher FSRP -> slower
    WMH progression.
  target_id: wmh-growth-fsrp-slope
- id: C6
  metric: Anti-hypertensive medication association with WMH growth rate
  paper_value: -0.019
  unit: log-WMH growth slope change (on treatment vs not)
  tolerance:
    type: relative
    value: 0.05
  source: paper Results 'FSRP Subcomponent Analysis'; Abstract
  author_match: unknown
  author_repr: null
  notes: 'Slope -0.019, 95% CI -0.03 to -0.007, p=0.002: hypertension treatment slows
