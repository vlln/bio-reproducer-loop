  unit: diazepam milligram equivalents (DME)
- target_id: bz-promis-anxiety-change
  question: 复现论文报告的 Change in PROMIS Anxiety T-score (week 0 to 10) 数值
  unit: PROMIS T-score points
- target_id: bz-six-month-sustainability
  question: 复现论文报告的 Sustainability of dose reduction at 6 months post-intervention
